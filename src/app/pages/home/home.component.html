<section class="page dashboard">
  <div class="page-grid">
    <app-page-load-shell
      [loadState]="pageState"
      loadingStatusMessage="Loading data"
      [kpiCount]="2"
      [errorMessage]="errorMessage"
      retryAriaLabel="Try loading Olympic data again"
      (retry)="onRetryLoad()"
    >
      <div class="dashboard__header span-full">
        <app-header [title]="titlePage" [indicators]="indicators"></app-header>
      </div>

      <div class="dashboard__chart span-full" *ngIf="pieChart">
        <app-medal-chart
          [chartData]="pieChart"
          [description]="chartDescription"
          (countrySelected)="onCountrySelected($event)"
        ></app-medal-chart>
      </div>
    </app-page-load-shell>
  </div>
</section>
