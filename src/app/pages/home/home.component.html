<section class="page dashboard">
  <div class="page-grid">
    <ng-container [ngSwitch]="pageState">
      <ng-container *ngSwitchCase="'loading'">
        <app-page-loading-skeleton
          class="span-full"
          statusMessage="Loading data"
          [showIntroLine]="true"
          [kpiCount]="2"
        ></app-page-loading-skeleton>
      </ng-container>

      <ng-container *ngSwitchCase="'empty'">
        <p class="page-status page-status--empty span-full" role="status">No data available</p>
        <a routerLink="/" class="btn btn--secondary span-full dashboard__back">Back</a>
      </ng-container>

      <ng-container *ngSwitchCase="'error'">
        <div class="page-status page-status--error span-full" role="alert">
          <p>{{ errorMessage }}</p>
          <a routerLink="/" class="btn" aria-label="Back to Dashboard">Try again</a>
        </div>
      </ng-container>

      <ng-container *ngSwitchCase="'ready'">
        <p class="dashboard__intro span-full">{{ introText }}</p>

        <div class="dashboard__header span-full">
          <app-header [title]="titlePage" [indicators]="indicators"></app-header>
        </div>

        <div class="dashboard__chart span-full" *ngIf="pieChart">
          <app-medal-chart
            [chartData]="pieChart"
            [description]="chartDescription"
            (countrySelected)="onCountrySelected($event)"
          ></app-medal-chart>
        </div>
      </ng-container>
    </ng-container>
  </div>
</section>
