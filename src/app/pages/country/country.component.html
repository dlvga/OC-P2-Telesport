<section class="page country-detail">
  <div class="page-grid">
    <app-page-load-shell
      [loadState]="pageState"
      loadingStatusMessage="Loading country data"
      [kpiCount]="3"
      [errorMessage]="errorMessage"
      retryAriaLabel="Try loading country data again"
      (retry)="onRetryLoad()"
    >
      <p class="country-detail__intro span-full">{{ introText }}</p>
      <app-country-card
        *ngIf="detailView"
        class="span-full country-detail__card"
        [detailView]="detailView"
      ></app-country-card>
    </app-page-load-shell>

    <div class="span-full country-detail__actions">
      <a routerLink="/" class="btn btn--secondary" aria-label="Back to Dashboard">Back to Dashboard</a>
    </div>
  </div>
</section>
